apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset-demo
spec:
  selector:
    matchLabels:
      app: daemonset-demo
  template:
    metadata:
      labels:
        app: daemonset-demo
    spec:
      # 共享 volume
      volumes:
      - name: shared-data
        emptyDir: {}
      # 初始化容器
      initContainers:
      - name: init-hostname
        image: quay.io/prometheus/busybox
        command:
        - sh
        - -c
        - |
          echo "Hello from node: $NODE_NAME" > /data/index.html
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: shared-data
          mountPath: /data
      containers:
      - name: nginx
        image: quay.io/nginx/nginx-unprivileged
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
